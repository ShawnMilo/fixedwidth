[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "FixedWidth"
version = "1.3"
description = "Two-way fixed-width <--> Python dict converter."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Shawn Milochik", email = "shawn@milochik.com" }]
keywords = ["fixed width"]
requires-python = ">=3.8"
dependencies = ["six"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ShawnMilo/fixedwidth"

[tool.setuptools]
packages = ["fixedwidth"]
